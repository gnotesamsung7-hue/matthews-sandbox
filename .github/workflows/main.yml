name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Use project folder if files were uploaded inside one
        run: |
          if [ ! -f package.json ] && [ -f matthews-sandbox/package.json ]; then
            shopt -s dotglob
            mv matthews-sandbox/* .
          fi
          ls

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Allow the microphone (for the sound studio)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $f
          cat $f

      - name: Add the Wi-Fi play code (LanLink)
        run: |
          d=android/app/src/main/java/io/github/gnotesamsung7hue/matthewssandbox
          mkdir -p $d
          cp native/LanLinkPlugin.java native/MainActivity.java $d/
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application#' $f
          ls $d

      - name: Set the app name (the apostrophe needs escaping on Android)
        run: |
          f=android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">Matthew\\\\'s Sandbox</string>#" $f
          sed -i "s#<string name=\"title_activity_main\">.*</string>#<string name=\"title_activity_main\">Matthew\\\\'s Sandbox</string>#" $f
          cat $f

      - name: Add the app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done

      - name: Use the same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: matthews-sandbox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MatthewsSandbox.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MatthewsSandbox.apk --target "$GITHUB_SHA" --title "Matthew's Sandbox - latest APK" --notes "Built automatically from the newest commit. Download MatthewsSandbox.apk below and open it on your phone."
